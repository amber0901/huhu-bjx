<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>百家姓</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/ui.css">
  <link rel="stylesheet" href="/brand.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="activities.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="brand-mark" src="/brand-mark.svg" alt="" aria-hidden="true" width="48" height="48"><strong>百家姓</strong></div>
    <nav class="poem-navigation" aria-label="返回写字"><button id="back-to-write" class="icon-button" aria-label="再写一个姓" title="再写一个姓"><svg class="icon" aria-hidden="true"><use href="/icons.svg#back"></use></svg></button></nav>
  </header>
  <main>
    <section id="scene" class="scene" aria-label="乌衣巷诗词画面" data-phase="idle">
      <img id="background" class="background" alt="小燕子、石桥和夕阳下的人家">
      <div class="reading">
        <div id="verses" class="verses"></div>
        <div class="poem-credit"><h1 id="title"></h1><p id="author"></p></div>
      </div>
      <div id="homes" class="homes" role="group" aria-label="找相同姓氏的小屋" hidden></div>
      <div id="poem-game" class="poem-game" hidden></div>
      <div id="character-game" class="character-game" role="group" aria-label="木和子拼成李" hidden>
        <div id="character-target" class="character-target"><span id="assembled-character" class="assembled-character" aria-hidden="true">李</span><div class="part-slot upper" data-part="木" aria-label="上面的木字位置"><span>木</span></div><div class="part-slot lower" data-part="子" aria-label="下面的子字位置"><span>子</span></div></div>
        <button class="character-part part-mu" data-part="木" aria-label="木字部件，点按或拖到上面">木</button>
        <button class="character-part part-zi" data-part="子" aria-label="子字部件，点按或拖到下面">子</button>
      </div>
      <button id="bird" class="bird" aria-label="小燕子，先在诗里找到你的姓"><img id="companion" alt="柔和水墨风的小燕子伙伴" draggable="false"></button>
      <div id="celebration" class="celebration" aria-hidden="true"></div>
    </section>
    <section class="controls" aria-label="诗画互动">
      <button id="play" class="primary icon-button" aria-label="听一听" title="听一听"><svg class="icon" aria-hidden="true"><use href="/icons.svg#speaker"></use></svg></button>
      <button id="help-home" class="icon-button" aria-label="帮帮我" title="帮帮我"><svg class="icon" aria-hidden="true"><use href="/icons.svg#bulb"></use></svg></button>
      <button id="reset" class="icon-button" aria-label="再玩一次" title="再玩一次"><svg class="icon" aria-hidden="true"><use href="/icons.svg#retry"></use></svg></button>
    </section>
    <p id="phase" class="phase sr-only" aria-live="polite">先在诗里找到自己的姓</p>
    <details class="teacher-settings"><summary class="icon-summary" aria-label="老师设置" title="老师设置"><svg class="icon" aria-hidden="true"><use href="/icons.svg#gear"></use></svg><span class="sr-only">老师设置</span></summary><div class="settings-content">
      <label><input id="music-toggle" type="checkbox" checked>古风轻音乐</label>
      <label>配乐音量<input id="music-volume" type="range" min="0" max="1" step="0.05" value="0.45"></label>
      <label class="seek-label">朗诵进度<input id="seek" type="range" min="0" max="1" step="0.01" value="0"></label><output id="clock">0:00 / 0:00</output>
      <p id="cache-status"></p>
    </div></details>
  </main>
  <audio id="narration" preload="auto"></audio><audio id="music" preload="auto" loop></audio>
  <script src="app.js" type="module"></script>
</body>
</html>
